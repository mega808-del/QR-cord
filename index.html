<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6cf6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>연락처 QR코드 생성기</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1c2333; --sub: #66708a;
    --accent: #3b6cf6; --accent-press: #2f55c9; --border: #dfe4f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151d; --card: #1c212e; --text: #eef1f8; --sub: #9aa3bd;
      --border: #2c3346;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "Apple SD Gothic Neo", sans-serif;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 430px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .desc { color: var(--sub); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; box-shadow: 0 4px 14px rgba(20, 30, 60, .06);
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%; padding: 13px 14px; font-size: 17px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 18px; padding: 15px; font-size: 17px; font-weight: 700;
    color: #fff; background: var(--accent); border: none; border-radius: 10px;
    cursor: pointer;
  }
  button:active { background: var(--accent-press); }
  button:disabled { opacity: .55; cursor: wait; }
  #result { display: none; margin-top: 22px; text-align: center;
    border-top: 1px solid var(--border); padding-top: 22px; }
  #qrimg {
    width: 240px; height: 240px; border-radius: 12px;
    border: 1px solid var(--border); background: #fff;
  }
  .who { font-size: 16px; font-weight: 700; margin: 12px 0 2px; }
  .tel { color: var(--sub); font-size: 14px; margin: 0 0 14px; }
  .btnrow { display: flex; gap: 10px; }
  .btnrow button { margin-top: 0; }
  .ghost {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  #status {
    margin-top: 14px; font-size: 14px; min-height: 20px; color: var(--sub);
    word-break: keep-all;
  }
  .error { color: #e5484d !important; font-weight: 600; }
  .ok { color: #2fa96e !important; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📇 연락처 QR코드 생성기</h1>
  <p class="desc">이름과 휴대폰 번호만 입력하세요. 스캔하면 연락처로 저장되는 QR코드를 만들어 드립니다. (갤럭시/아이폰 공용)</p>

  <div class="card">
    <!-- 핵심 기능: 입력폼이 항상 맨 앞에 표시됨 -->
    <form id="qrform">
      <label for="name">이름</label>
      <input id="name" placeholder="예: 홍길동" maxlength="30" required autocomplete="name">

      <label for="phone">휴대폰 번호</label>
      <input id="phone" placeholder="예: 010-2345-6789" maxlength="20" required inputmode="tel" autocomplete="tel">

      <button type="submit" id="genBtn">QR코드 생성</button>
    </form>

    <!-- 생성 결과: 폼 아래에 표시 (입력값은 유지되어 바로 수정·재생성 가능) -->
    <div id="result">
      <img id="qrimg" alt="연락처 QR코드">
      <div class="who" id="who"></div>
      <div class="tel" id="tel"></div>
      <div class="btnrow">
        <button type="button" id="downloadBtn">⬇️ 이미지 저장</button>
        <button type="button" id="shareBtn" class="ghost">🔗 링크 복사</button>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script>
var form = document.getElementById('qrform');
var genBtn = document.getElementById('genBtn');
var result = document.getElementById('result');
var qrimg = document.getElementById('qrimg');
var who = document.getElementById('who');
var tel = document.getElementById('tel');
var statusEl = document.getElementById('status');
var downloadBtn = document.getElementById('downloadBtn');
var shareBtn = document.getElementById('shareBtn');

var currentDataUrl = null;
var currentName = '';

// 공유 링크는 반드시 "온라인 배포 주소"여야 상대방이 열 수 있음.
// ?p= 쿼리 파라미터를 쓰는 이유: 카카오톡 등 일부 앱이 URL 뒤에 붙는 #조각을
// 잘라내거나 이스케이프해 #만으로는 데이터가 유실될 수 있음 (?p=은 유지됨).
// 페이로드는 "1.<이름 b64u>.<번호 원문>" — vCard는 받는 쪽에서 재구성하므로 전송하지 않음.
var SHARE_BASE = 'https://mega808-del.github.io/QR-cord/share.html?p=';

function setStatus(msg, cls) {
  statusEl.textContent = msg || '';
  statusEl.className = cls || '';
}

function safeFile(name) {
  return 'vcard_' + (name || 'contact').replace(/[\\/:*?"<>|\s]+/g, '') + '.png';
}

function buildVCard(name, phone) {
  return 'BEGIN:VCARD\nVERSION:3.0\nN:' + name + ';;;\nFN:' + name +
         '\nTEL;TYPE=CELL:' + phone + '\nEND:VCARD';
}

function validateName(name) {
  if (!name) return '이름을 입력해 주세요.';
  if (name.length > 30) return '이름이 너무 깁니다. (30자 이내)';
  if (/[\r\n]/.test(name)) return '이름에 줄바꿈을 사용할 수 없습니다.';
  return null;
}

function validatePhone(phone) {
  var p = (phone || '').replace(/[-\s.]/g, '');
  if (!/^0\d{9,10}$/.test(p)) return { error: '휴대폰 번호 형식이 올바르지 않습니다. 예: 010-2345-6789' };
  return { value: p };
}

// UTF-8 안전 base64url (공유 링크 payload)
function b64uEncode(str) {
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(t);
  }
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try {
      var ok = document.execCommand('copy');
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (e) { reject(e); }
    finally { ta.remove(); }
  });
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  if (!name || !phone) { setStatus('이름과 휴대폰 번호를 모두 입력해 주세요.', 'error'); return; }

  var nameErr = validateName(name);
  if (nameErr) { setStatus(nameErr, 'error'); return; }
  var p = validatePhone(phone);
  if (p.error) { setStatus(p.error, 'error'); return; }

  genBtn.disabled = true;
  setStatus('QR코드를 생성하는 중...', '');
  try {
    var vcard = buildVCard(name, p.value);
    currentDataUrl = await QRCode.toDataURL(vcard, {
      errorCorrectionLevel: 'M', margin: 4, width: 520
    });
    currentName = name;
    qrimg.src = currentDataUrl;
    who.textContent = name;
    tel.textContent = p.value;
    result.style.display = 'block';
    setStatus('생성 완료! 이미지를 저장하거나 링크를 복사해 공유하세요.', 'ok');
  } catch (err) {
    setStatus(err && err.message ? err.message : '오류가 발생했습니다.', 'error');
  } finally {
    genBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', function () {
  if (!currentDataUrl) return;
  var a = document.createElement('a');
  a.href = currentDataUrl;
  a.download = safeFile(currentName);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStatus('이미지를 다운로드했습니다.', 'ok');
});

shareBtn.addEventListener('click', async function () {
  if (!currentDataUrl) return;
  var phoneNorm = document.getElementById('phone').value.replace(/[-\s.]/g, '');
  var link = SHARE_BASE + '1.' + b64uEncode(currentName) + '.' + phoneNorm;
  try {
    await copyText(link);
    setStatus('공유 링크를 복사했습니다! 메신저로 보내면 상대방이 바로 저장할 수 있어요.', 'ok');
  } catch (err) {
    setStatus('공유 링크: ' + link, '');
  }
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
